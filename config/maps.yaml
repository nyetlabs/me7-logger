# By caller, then at, then interp, then name.
# Which caller function passes each map. The address is the immediate at that
# call, and it is not stored here. at is the byte distance from the caller
# label to the CALLS. caller is the Funktionsrahmen module and the entry.
# interp is the map_interp needle.
# Two rows with one name are two calls that pass the same map.
# The axis point count and its width are read from the image. That is the column axis.
# When the call loads it from a RAM word, that word holds the header a setup stored:
# the low 14 bits in R12, and the page in R13 when the header is not on DPP0.
# The row axis is not an argument of the call.

