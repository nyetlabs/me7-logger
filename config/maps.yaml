# Which caller function passes each map. The address is the immediate at that
# call, and it is not stored here. at is the byte distance from the caller
# label to the CALLS. caller and interp are function needle names.
# Two rows with one name are two calls that pass the same map.
# The axis point count and its width are read from the image. The row count is not.

maps:
# Ignition timing. Both calls pass the same map.
- name: KFZW
  caller: ign_zw
  at: '0x5DE'
  interp: map_interp_table8
- name: KFZW
  caller: ign_zw
  at: '0x620'
  interp: map_interp_table8
- name: KFZW2
  caller: ign_zw
  at: '0x5B8'
  interp: map_interp_table8
- name: KFZW2
  caller: ign_zw
  at: '0x5FC'
  interp: map_interp_table8
- name: KFZWWLNM
  caller: ign_zw
  at: '0x6BC'
  interp: map_interp_table8
# LDRQ. Each row is one call.
- name: KFLDRQ2
  caller: ldrq
  at: '0x70'
  interp: map_interp_table16_page
- name: LDRQ0DY
  caller: ldrq
  at: '0x86'
  interp: map_interp_curve16
- name: LDRQ1DY
  caller: ldrq
  at: '0xA2'
  interp: map_interp_curve16
- name: LDRQ1ST
  caller: ldrq
  at: '0xC8'
  interp: map_interp_curve16
- name: KFLDRL
  caller: ldrq
  at: '0x228'
  interp: map_interp_table16_page
# Other wiki maps. The caller is the bytes after the return. The map
