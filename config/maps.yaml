# By caller, then at, then interp, then name.
# Which caller function passes each map. The address is the immediate at that
# call, and it is not stored here. at is the byte distance from the caller
# label to the CALLS. caller is the Funktionsrahmen module and the entry.
# interp is the map_interp needle.
# at is one distance or a list. A list is several calls on one caller and one
# interp. One image matches one of them. A different caller or interp stays
# its own row. One caller and distance may not be repeated.
# The axis point count and its width are read from the image. That is the column axis
# when R13 is that header. A load of R14 or R15 from a RAM word is a header a setup
# stored: the low 14 bits in R12, and the page in R13 when the header is not on DPP0.
# A word whose header is the column is the column index. A different header is the row.
# Two different row headers leave the row unset. A page call that does not load that
# word leaves the row unset.

