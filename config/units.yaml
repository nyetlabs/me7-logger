    KFLDIMX, KFVPLGU]}
- {bits: 8, name: amp, unit: "", factor: 800/0x10000}
- {bits: 8, name: half, unit: "%", factor: 1/2, precision: 3, x: [DLBTS]}
- {bits: 8, name: retard, unit: "°KW", factor: -3/4}
- {bits: 16, name: torque, unit: "", factor: 100/0x10000}
- {bits: 16, name: twice, unit: "", factor: 200/0x10000}
- {bits: 8, unit: "%", factor: 0.0976470588235294, precision: 3, maps: true, z: [KFMRES, KFMRESK]}
- {bits: 8, unit: "%", factor: 50/128, precision: 3, maps: true, z: [
    KFLDRAPP, KFMDZOF_UM, KFMIZUFIL, KFMIZUNS, KFMIZUOF, KFMI_UM, KFMPED_UM, KLDMASRL, MDIMX], y: [
    KFMDZOF_UM, KFMIZUOF]}
- {bits: 8, unit: "%", factor: 64/100, precision: 3, maps: true, z: [KFLDIOPU, LDIATA]}
- {bits: 8, unit: "% DK", factor: 100/255, precision: 3, maps: true, x: [KFVPDKLD]}
- {bits: 8, unit: "(kg/h)/(1/min)(%)", factor: 0.0000078125, precision: 9, maps: true, z: [KUMSRL]}
