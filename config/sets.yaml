# One map. The first name is the plain form. Tier and axis count stay in
# testdata/parity/names/tuner.yaml.
# either: one address covers any name in the set.
# both: every later name covers the plain name. One does not.
# any: one located form closes the tuner slot.
#
# except: me7parity corpus --submit. Names a manual/DAMOS/A2L reference lists
# at another address that our address supersedes; they count with the agreeing
# names for the matched class (was testdata/parity/references.yaml).
except:
  - ESKONF
sets:
  - {rule: either, names: [KFLBTS, KFLBTS_0_A]}
  - {rule: either, names: [KFFWL, KFFWL_0_A]}
  - {rule: either, names: [LDRXN, LDRXN_0_A]}
  - {rule: both, names: [KFPED, KFPED_0_A, KFPED_1_A]}
  - {rule: both, names: [KFPEDR, KFPEDR_0_A, KFPEDR_1_A]}
  - {rule: any, names: [KFZW2, KFZW2_0_A, KFZW2_1_A]}
  # One ignition-timing op map closes the slot. S/Q keep KFZWOP2 only.
  - {rule: any, names: [KFZWOP, KFZWOP2]}
  - {rule: any, names: [NFSM, NFS2M, NFS2M_0_A, NFS2M_1_A]}
  - {rule: any, names: [NLLM, NLLM_0_A, NLLM_1_A, NLLM_2_A, NLLM_3_A]}
  - {rule: any, names: [NLL2M, NLL2M_0_A, NLL2M_1_A, NLL2M_2_A, NLL2M_3_A]}
  # 4Z and similar: DAMOS splits the plain scalar into VMAXNB_0_A/_1_A.
  - {rule: any, names: [VMAXNB, VMAXNB_0_A, VMAXNB_1_A]}
