# Byte patterns that label functions and data tables. Edit this file.
# Checksum and flash-kernel patterns are in config/examples/needles.yaml.
# Copy a row from there into config/user to use it.
#
# In data, keep 5-baud, then fast-init, then the selector.
# Keep map_interp_* in the order written. Sort the other functions by name.
#
# needle_hex    Hex bytes. Spaces are optional. X is a nibble wildcard, so XX is
#               one wildcard byte. [VV/MM] is a byte whose bits under MM equal VV.
#               Only word-aligned hits count. A list is one pattern per code
#               layout. Those patterns share back_up, and unique counts every hit.
#               Use needles when each prologue needs its own back_up, unique,
#               or entry_after.
# mask_hex      Optional per-byte mask, combined with the wildcard mask.
#               A byte matches when (image & mask) == (pattern & mask).
# back_up       The label is the hit minus this many bytes. Negative moves the
#               label forward. Omitted means 0, so the label is the hit.
#               [min, max] is an even span and needs entry_after. The label is
#               the closest match from hit-min down to hit-max. Use it when the
#               bytes before the needle change length between builds.
# unique        Report and skip the needle when it hits more than once.
#               Omitted means true.
# entry_after   Byte strings. One of them has to sit just before the label,
#               such as a RETS or erased flash.
#
# data          The label is a table or other bytes.
# functions     The label is a function entry. map_interp_* is a shared
#               interpolator. A caller is named module_entry and passes a map
#               address. A measurement pattern belongs on the measurement row.

data:
  # First row of the 5-baud address table. Byte 0 is 0x01 or 0x11 (bit 4 masked).
  # Byte 6 is that address complemented, 0xFE or 0xEE. Byte 31 is the next row's
  # sync 0x55, so a single copy of the row does not match. The label is the row.
  - name: slow_init_table
    needle_hex: "01 55 EF 8F 70 00 EE 01 3C 00 2C 01 XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX 55"
    mask_hex: "EF FF FF FF FF FF EF FF FF FF FF FF 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 FF"

  # Application store of the fast-init physical target. The immediate is 0x10
  # (back_up -14 lands on that byte). Images that compare a literal 0x01 in the
  # address filter do not have this store, so Fast stays unset there.
  - name: fast_init_physical
    needle_hex: "E6 F5 06 02 F6 F4 XX E2 F6 F5 XX E2 E7 F8 10 00 F7 F8 XX E2"
    back_up: -14

  # Selector 0, and the dispatcher table in front of it. The anchor is 38 bytes
  # before the prefix. The bytes between them are SHR R5,#4 / CMP R5,#max /
  # ADD R5,#table / JMPI [R5]; generate walks every table entry that is a prefix.
  # Byte 40 of the prefix is 0x12 or 0x14.
  - name: result_selector_0
    needle_hex: "E0 09 E6 F8 XX XX E1 0E E1 0C E0 04 XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX XX D4 40 XX 00 66 F4 0F 00"
    back_up: -38

  # The same anchor when the dispatcher is SUB R5,#1. The label is that
  # instruction. Its jump table entries are the case bodies.
  - name: result_selector_sub
    needle_hex: "E0 09 E6 F8 XX XX E1 0E E1 0C E0 04 XX XX XX XX XX XX 28 XX 46 XX"
    back_up: -18

functions:
  # 8-bit table (two inputs). Callers pass the map body in R12 and an
  # axis header in R13 (MOV R12,#imm / MOV R13,#imm / MOV R14,mem /
  # MOV R15,mem / CALLS). The map address is that R12 immediate, resolved
  # through the runtime DPP. Rows and columns come from this image. The same
  # 20 bytes begin sibling helpers that nothing calls, so a hit is not unique.
  - name: map_interp_table8
    needles:
      - needle_hex: "26 F4 00 80 8D 04 7D 06 E6 F4 FF 7F 0D 03 6D 02 E6 F4 00 80"
        unique: false
      # 23g calls this entry. The 20-byte body above is present and nothing calls it.
      - needle_hex: "EA 30 XX XX F3 FA 8C 8E 47 FA"
      # 4Z7 calls this body through segment 0. Two copies. The twin on 22m ends F2 F1.
      - needle_hex: "A9 4D C0 4D F0 1E C0 31 1B 1D 02 FC"
        unique: false
      # 22N callers enter the first copy of the 20-byte body twelve bytes in.
      - needle_hex: "0D 03 6D 02 E6 F4 00 80 F6 F4 DE 8A"

  # Second 8-bit table entry, same call. One hit on the images that have it.
  - name: map_interp_table8_b
    needles:
      - needle_hex: "E4 8F F6 8E DE 8F F6 8E 06 90 F6 8E"
      # 23g entry. Callers still land here.
      - needle_hex: "0D 00 FD F4 F0 C0 E0 ED E0 9E E6 FF DE BB"
      # 22N calls this body with segment 0. The 22m prologue is not in that image.
      - needle_hex: "5E BC 9A F5 63 70 E7 F8 BF 00 65 F8"
      # Same 4Z7 body as map_interp_table8. KFMRES on that image calls the other copy.
      - needle_hex: "A9 4D C0 4D F0 1E C0 31 1B 1D 02 FC"
        unique: false

  # 16-bit table, same R12/R13 call. Two copies of the body. Rows and columns
  # come from this image.
  - name: map_interp_table16
    needle_hex: "A9 2D C0 2D F0 1E C0 31 1B 1D F2 F1"
    unique: false

  # 8-bit table. Same call as table16; this is that routine's 8-bit body.
  # Two entries share the prefix.
  - name: map_interp_table8_twin
    needle_hex: "A9 4D C0 4D F0 1E C0 31 1B 1D F2 F1"
    unique: false

  # 8-bit curve (one row). The column count comes from this image. R12 is the
  # near address and R13 is the page. Three bodies share these eight bytes;
  # the bytes after them differ.
  - name: map_interp_curve8
    needle_hex: "F0 3E C0 72 00 C2 DC 4D"
    unique: false

  # 16-bit curve. R13 is the page. Two copies of the body. The column count
  # comes from this image.
  - name: map_interp_curve16
    needle_hex: "F0 3E C0 72 5C 12 00 C2 DC 4D 98 4C"
    unique: false

  # 8-bit curve. R13 is the page. The input is a register move, not a memory load.
  - name: map_interp_curve8_reg
    needle_hex: "F0 3E DC 4D 99 2C F0 2C"

  # 8-bit table outside the default DPP window. R13 is the page and R12 is
  # the low 14 bits. Two copies.
  - name: map_interp_table8_page
    needle_hex: "D4 A0 00 00 D4 B0 02 00 DC 4F A9 4E"
    unique: false

  # 16-bit table, same page calling convention. Two copies.
  - name: map_interp_table16_page
    needle_hex: "D4 A0 00 00 D4 B0 02 00 DC 4F A9 2E"
    unique: false

  # 16-bit curve. R12 is the DPP pointer, not a page. Callers also pass axis
  # breakpoints this way.
  - name: map_interp_curve16_direct
    needle_hex: "E7 F2 80 00 75 F2 C2 8F"

  # 8-bit curve. R12 is the DPP pointer.
  - name: map_interp_curve8_direct
    needles:
      - needle_hex: "F6 8E A0 B4 F6 8E 98 B4 F7 8E 4A B2 F7 8E 4B B2 F7 8E 4D B2 F2 F4"
      # Called entry once the direct curve no longer begins with the bytes above.
      - needle_hex: "F3 F8 XX XX 47 F8 11 00 3D 0E D7 40"
      # 22N entry that segment 0 calls reach.
      - needle_hex: "9A 84 C2 F4 XX XX 5C 84 F6 F4 XX XX E7 F8 80 00 F7 F8"

  # 16-bit curve. Callers enter here, twelve bytes into a copy of the table8
  # prefix. The table8 needle labels the earlier byte, and nothing calls that byte.
  - name: map_interp_curve16_entry
    needles:
      - needle_hex: "0D 03 6D 02 E6 F4 00 80 F6 F4 C8 8F"
      - needle_hex: "2C 01 FD 04 E6 F5 2C 01 F6 F5 70 8E"
      # 4Z7 and the 1.8T images. Two copies. The curve16 prologue on 22m is F0 3E.
      - needle_hex: "F0 3D C0 72 5C 12 00 C2 98 4C"
        unique: false

  # Caller functions. The name is the Funktionsrahmen module, then the entry.
  # config/maps.yaml gives the byte distance from that entry to the CALLS.
  # A second pattern in needle_hex is the same entry on another layout.
  # The patterns share back_up. needles is a prologue with its own back_up.
  # "XX" is an R12 or R13 immediate, or an address that changes per image.
  - name: DWKR_dwkr
    needle_hex:
      - "9A 04 0B XX E6 FC XX XX E6 FD 06 02"
      - "9A 04 0B 70 E6 FC XX XX"

  # Ignition-timing caller. config/maps.yaml names the maps at fixed distances
  # from this label. One hit on the images that have it.
  - name: ZWGRU_ign_zw
    needles:
      - needle_hex: "88 90 88 80 88 70 88 60 9A XX 03"
      # 22N. The jump bit differs. The maps sit at the 22m distances.
      - needle_hex: "88 90 88 80 88 70 88 60 9A 58 03 F0"
      # 23g ignition entry. The warm-up map sits in ZWGRU_ign_wl.
      - needle_hex: "88 90 88 70 88 60 28 02 F3 F8 50 8C 47 F8 FF 00"
      # 4Z7 ignition entry. One less push, and the F3 address differs per image.
      - needle_hex: "88 90 88 80 28 02 F3 F8 XX XX 47 F8 FF 00"

  - name: ZWGRU_ign_wl
    needle_hex:
      - "88 90 88 80 E6 FC XX XX E6 FD CE 00 F2 FE"
      # 4Z7. The byte after E6 FD is E7.
      - "88 90 88 80 E6 FC XX XX E6 FD E7 00 F2 FE"

  - name: ARMD_kfdmd
    needles:
      - needle_hex: "28 04 9A 00 05 90 8A XX 03"
        entry_after: ["DB 00"]
      # 22N pushes two registers first. The byte after 8A is 0C.
      - needle_hex: "88 90 88 80 28 04 9A 00 05 90 8A 0C"

  - name: LAMBTS_kflbts
    needle_hex:
      - "88 90 88 80 88 70 88 60 28 04 E6 FC XX XX F2 FD XX XX DA 00 D0 71"
      - "88 90 88 80 88 70 88 60 28 04 E6 FC XX XX F2 FD EE 97"

  - name: MDBAS_kfmiop
    needle_hex: "88 90 88 80 88 70 F2 F7"

  - name: MDZW_kfmizu
    needle_hex:
      - "88 90 88 80 88 60 28 04 9A 55 0C XX"
      - "88 90 88 80 88 60 28 04 9A 56 0C 50"

  # Callers for the other wiki maps. config/maps.yaml names each map at a
  # fixed distance from the label. "XX" is an R12 or R13 immediate: that
  # address changes per ECU, so it is not part of the pattern. One hit on
  # the images that have the caller.
  - name: MDUEB_kfmped
    needles:
      - needle_hex: "88 60 F2 F4 XX XX 68 43 EA 30 B0 57"
      # Same entry on the 23g images. The memory operand and the jump target differ.
      - needle_hex: "88 60 F2 F4 XX XX 68 43 EA 30 B2 20"
      # 22N memory operand. The jump target matches the first pattern.
      - needle_hex: "88 60 F2 F4 2A 89 68 43 EA 30 B0 57"
      # NL jump target.
      - needle_hex: "88 60 F2 F4 XX XX 68 43 EA 30 D2 1E"

  - name: LLR_kfmres
    needles:
      - needle_hex: "88 90 88 80 88 70 88 60 28 04 C2 F8"
      - needle_hex: "88 90 88 80 88 70 88 60 28 04 C2 F6"

  - name: FUEDK_kfvpdks
    needle_hex:
      - "8A XX 04 XX 8A XX 02 XX 9A XX 12 XX E6 F4 FF 7F"
      # 4Z7 entry. The calls sit past the distances used on 22m.
      - "88 90 88 80 88 70 88 60 D7 40 06 02 F3 FC DF 1E"

  - name: FUEDK_kfvplgu
    needle_hex: "E6 FC XX XX F2 FD XX XX F2 FE XX XX DA 00 42 76 F6 F4 XX XX F2 F5"

  - name: MDBAS_kfzwop
    needles:
      - needle_hex: "88 90 88 80 88 70 88 60 28 04 E6 FC XX XX F2 FD 90 F9"
      - needle_hex: "88 90 88 80 88 70 88 60 28 04 E6 FC XX XX F2 FD 0E F9"
      - needle_hex: "88 90 88 80 88 70 88 60 28 04 E6 FC XX XX F2 FD 92 F9"

  # 4Z7 entry. 0x28 is KFMIOP. 0x40 passes the KFZWOP body, which the 22m row names KFZWOP2.
  - name: MDBAS_kfzwop_b
    needle_hex: "88 90 88 80 88 70 88 60 28 06 E6 FC XX XX F2 FD"

  - name: LAMFAW_lamkr
    needle_hex: "88 90 88 80 88 70 88 60 28 02 F2 F4 XX XX 88 40 C2 F5 XX F8"

  - name: LDRLMX_ldhbn
    needles:
      - needle_hex: "88 90 88 80 C2 F4 B3 F9"
      # 23g pushes one more register before the same call.
      - needle_hex: "88 90 88 80 88 70 C2 F4 XX XX 46 F4"
      # 22N stores two bytes before that call.
      - needle_hex: "88 90 88 80 88 70 F3 F8 XX XX F7 F8 XX XX C2 F4 XX XX 46 F4"

  - name: LDRPID_ldiopu
    needles:
      - needle_hex: "88 90 88 80 88 70 88 60 28 02 F2 F4 XX 8F"
      # 23g opens the page with D7 instead of the F2 load above.
      - needle_hex: "88 90 88 80 88 70 88 60 28 02 D7 40 06 02 F3 F8"
      # 22N reserves a larger frame. 28 XX is ambiguous on 23g.
      - needle_hex: "88 90 88 80 88 70 88 60 28 06 D7 40 06 02 F3 F8"

  # 22N entry that passes KFWPLGTA. 22m reads that map in LDRPID_ldiopu.
  - name: LDRPID_plsolr
    needle_hex: "DB 00 F2 F4 XX XX 88 40 F2 F5 XX XX 88 50 E6 FC XX XX E6 FD 07 02 E6 FE XX XX E6 FF 04 02 DA 80"
    back_up: -2

  # 23g entry that passes KFNLLNST. The prologue is this image's.
  - name: nllnst_entry
    needle_hex: "88 80 88 70 88 60 9A 02 02 40 EA 00 04 B7 9A 58"

  # Caller for the LDRQ maps. config/maps.yaml names each map at a fixed
  # distance from this label. One hit on the images that have it.
  - name: LDRPID_ldrq
    needle_hex: "88 90 88 80 88 70 88 60 28 02 9A XX 0F XX"

  - name: LLR_nfsm
    needle_hex:
      - "88 70 88 60 9A 02 02 XX EA 00"
      - "88 70 88 60 9A 02 02 80 EA 00 FE B5"

  - name: LLR_nllm
    needle_hex: "88 90 88 70 88 60 28 02 C2 F4"

  - name: LLR_nllm_b
    needle_hex: "88 C0 88 90 88 80 88 70 88 60 28 04 F4 80"

  - name: ASE_rlsalun
    needle_hex: "88 90 88 80 F2 F4 XX XX 68 41 EA 20"

  - name: BGMSZS_wdkugdn
    needles:
      - needle_hex: "28 04 F2 F4 XX XX F2 F5 XX XX 1B 54"
      - needle_hex: "C2 F4 XX XX 88 40 F2 FC XX XX F2 FD XX XX E6 FE"
