# Finder order for the blocks in layouts.yaml. Opinion, not a stage.
# Highest first. Every block is listed once.
# 2.7T/RS6 codes: files.s4wiki.com/stock/part-numbers.txt.
# 1.8T codes: publish/vehicles.yaml (compiled from that list plus other
# sources; confirm independently, do not treat as ground truth alone).
# Block names are needle families (layouts.yaml), not the ID-string token after //
# in the Bosch banner (datasets.yaml). That token can differ and still sit here.
- 22m    # 2.7T APB, AZB, AZA. 8D0907551H banner is //22l//; needles still match G.
- 22N    # 2.7T APB. 8D0907551 T/AA only; separate needles from 22m.
- 24BCD  # 1.8T AWP, AUM, AUQ, BAM, BEA.
- 24bH   # 1.8T AVJ, AWM. CH/CM only.
- 24E    # 1.8T AWT. 4B0906018DC; NMAXF in DAMOS, no SNM16OPUW.
- 24G    # 1.8T AWT/BFB. DH + 8E0909518AA; SNM16OPUW in DAMOS/generate, no NMAXF.
- 24KS   # 1.8T AWM/AVJ/BEX. DQ, AK, AS, 8E0909559E; neither NMAXF nor SNM16OPUW.
- 23g    # 2.7T ASJ, AZR. 8D0907551 F/K/Q.
- 25A    # 2.7T BEL; 4Z7907551Q is BES. 4Z7907551T banner is //25B//; needles stay here.
- X22ka  # 2.7T APB. 8D0907551 A/B only.
- 25C    # 4.2T BCY.
- X22    # 1.8T APH. 06A906032S / 4B0906018Q.
- 05A    # Spyker 4.2. No engine code on the part list.
