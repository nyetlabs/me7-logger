- {name: rlp_w, size: 2, from: '0x820000', absent: E6FCXXXXF2FDXXXXE6FE1X00DAXXXXXX7C14F05X00545D0X, pattern: E6FCXXXXF2FDXXXXE6FE1F00DAXXXXXXF05X7C14, single: true, at: 6}
# scanKlf rebinds nmot and rl from this window when both are already stored.
- {name: nmot, size: 1, from: '0x820000', open: '06F480018840E6FCXXXXE6FDXXXX{nmot:C2FE}{rl:C2FF}DA8XXXXX', pattern: E6FCXXXXE6FDXXXXC2FEXXXXC2FFXXXXDAXXXXXX, at: 10, also: [{name: rl, size: 1, at: 14}]}
- {name: detazwbs, size: 1, from: '0x804000', pattern: [D740E100F7FAXXXX9A44, D740E100F7FAXXXX9A420A70], single: true, at: 6}
- {name: dzwg, size: 1, from: '0x804000', pattern: D740E100F78EXXXX0D06F480, single: true, at: 6}
# scanWnw looks tanwre up. The F7 F8 word in this window is that byte.
- {name: tanwre, size: 1, from: '0x820000', pattern: D740XX02C2F4XXXX66F410002D0EF3FXXXXXF7F8XXXXF3FA, at: 20}
# scanKhfm's C2 F5 word. This has to precede the F6 F5 A0 E0 row, which stores a different near word.
- {name: fkhfm, size: 1, from: '0x820000', pattern: F7F8XXXXC2F4XXXXC2F5XXXX1B45F607, single: true, at: 10}
- {name: fkhfm, size: 1, from: '0x800200', pattern: F6F5A0E0E118XXXX9CE0, single: true, at: 6}
- {name: misopl1_w, size: 2, from: '0x804000', pattern: 0EFE3D03F68FXXXX0D19, single: true, at: 6}
- {name: ngfil_w, size: 2, from: '0x804000', pattern: F2F008E4F2F5XXXX7D01, single: true, at: 6}
- {name: tsel, size: 1, from: '0x804000', pattern: D740E100C2FFXXXXDA83243FD740E100C2F5, single: true, at: 6}
- {name: tsrldyn, size: 1, from: '0x804000', pattern: 0D03F049F7F8XXXXF3F8, single: true, at: 6}
- {name: uzue, size: 1, from: '0x804000', pattern: E7F8FF00F7F8XXXXE6FC, single: true, at: 6}
- {name: zwgru, size: 1, from: '0x804000', pattern: 88908880D2F4XXXXD2F5, single: true, at: 6}
- {name: gangllr, size: 1, from: '0x804000', pattern: F3F8XXXXD740E100F7F8XXXX0D04D740E100F78EXXXXE6FC, single: true, at: 10}
- {name: fcmEnd, size: 1, from: '0x804000', pattern: 0D0509C143FCXXXXEA804ADC, single: true, at: 6}
- {name: fcmEnd, size: 1, from: '0x804000', pattern: 74E00D0509C143FCXXXXEA80, single: true, at: 8}
- {name: tevfakge_w, size: 2, from: '0x804000', pattern: C695F2F474E09AF402E0EA00XXXXF3F8, single: true, at: 12}
- {name: tmotrvmx_b2w, size: 2, from: '0x804000', pattern: D740E100F7F8XXXXE6FC181D, single: true, at: 6}
- {name: pvdkdsu_w, size: 2, from: '0x804000', pattern: 9D01E005D740E100F6F5XXXXF6F5DC93, at: 10}
# signVars stores pvdkds from this window when the pvdks_w chain missed.
- {name: pvdkds, size: 1, from: '0x804000', pattern: '{pvdkds_w:F2FX}7C8XF7FXXXXX', at: 8}
- {name: frkte_w, size: 1, from: '0x804000', pattern: [EA00XXXXC2F4XXXXF2F5, E6F5FFFFF7FAXXXXC2FCEC1D], single: true, at: 6}
- {name: ftek_w, size: 1, from: '0x804000', pattern: E6F40080F6F4XXXXE6F50080F6F562A2, single: true, at: 6}
- {name: tevfa_w, size: 1, from: '0x804000', pattern: 1B54F2FF0CFEF2FE0EFE46FF1F003D0246FEE0FFFD03F68FXXXX0D09, single: true, at: 24}
- {name: tevfakge_w, size: 2, from: '0x804000', pattern: F2F46AA2F6F4XXXX4840, single: true, at: 6}
- {name: uhfm_w, size: 2, from: '0x804000', pattern: 66F1FF03F6F1XXXXF2F4, single: true, at: 6}
# scanLdrxn KFFSLDE / KFFLLDE. The DA00 AE6C window is the one those axes use.
- {name: wkrmdy_w, size: 2, from: '0x820000', pattern: DA00AE6CF6F4XXXXF6F5XXXXF2F2XXXXF6F2XXXXF2F3XXXX8830, single: true, at: 18}
- {name: wkrmstat_w, size: 2, from: '0x820000', pattern: DA00AE6CF6F4XXXXF6F5XXXXF2F4XXXXF6F4XXXXF2F5, single: true, at: 18}
# The same pair on the early images, plus wkrmsu from the F7 8F word.
- {name: wkrmstat_w, size: 2, from: '0x820000', pattern: F0495C14F6F4XXXXC2F9XXXXC2F4XXXX009446F9FF00FD03F78FXXXX, single: true, at: 10, also: [{name: wkrmdy_w, size: 2, at: 14}, {name: wkrmsu_w, size: 2, at: 26}]}
# The mov r12 immediate is 04 01, or 26 01 on the 512K 06A file.
- {name: wkrmdy_w, size: 2, from: '0x804000', pattern: 'E6FC[04/DD]01F2FDXXXXF2FE', single: true, at: 6}
- {name: wkrmstat_w, size: 2, from: '0x804000', pattern: [E6FCF200F2FDXXXXF2FE, E6FC1401F2FDXXXXF2FE], single: true, at: 6}
- {name: zwoutar_0, size: 1, from: '0x800200', pattern: E6FC6000E6FDXXXX998D, single: true, at: 6, also: [{name: zwoutar_1, size: 1, add: 1}, {name: zwoutar_2, size: 1, add: 2}, {name: zwoutar_3, size: 1, add: 3}]}
# fkhfm on F22ig, loaded through DPP2.
- {name: fkhfm, size: 1, pattern: 1273F7F8XXXXC2F4058B, single: true, at: 4}
- {name: ftek_w, size: 1, pattern: E6F40080F6F4XXXXDB009A4A55B0, single: true, at: 6}
- {name: tevfakge_w, size: 2, pattern: F2F438A1F6F4XXXX48403D05, single: true, at: 6}
- {name: uhfm_w, size: 2, pattern: 66F2FF03F6F2XXXXF2F404F8, single: true, at: 6}
# uhfm_w is the word after F2 FX in the KRKTE scan.
- {name: uhfm_w, size: 2, from: '0x804000', pattern: F2FXXXXX7C1X5C1XD4XXXXXX, single: true, at: 2}
# signVars on 06A906032BB. The first hit is the F6 F4 word.
- {name: uhfm_w, size: 2, from: '0x804000', pattern: DB00F2FXXXXX66FXFF03F6FXXXXXDB00, at: 12}
