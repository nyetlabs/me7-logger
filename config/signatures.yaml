# Byte patterns that locate a RAM address.
# Rows run from top to bottom. A row can splice in a name an earlier row
# already found, so add it below that name. A flash body is a row in
# mapsigs.yaml.
#
# calls
#   Bootrom call-table words. The outer key is the slot. The inner keys are
#   the tables 0, 402, and 602. Keep them quoted.
#   {slot:N} inserts the word for slot N, using the same call count as the clock.
#   N is the callsSlot argument: 13 is 0xd, 14 is 0xe, 17 is 0x17, and the
#   other keys are the hex digits of the argument.
#
# name      Bosch name to store.
# size      Width in bytes.
# from      Lowest address to search. Omitted means 0x804000.
# pattern   Bytes to find. One string, or a list tried in order.
#           X is a nibble wildcard. [VV/MM] is one byte whose
#           bits under mask MM equal VV. {name:MID} splices a known
#           address in EXTP form: page, the name, then the word.
# open      Find this copy first. The DB00 window around it limits pattern.
#           The copy has to occur once unless first is set.
# first     With open, keep the first copy when several exist.
# in        Search the window an earlier open row saved.
# after     Start just after that row's hit and stop at the next DB00.
# absent    Skip this row when this pattern is already in the range.
# single    Keep the row only when the pattern occurs once.
# steps     Several searches in a chain. skip is bytes past the previous hit.
# at        Bytes from the hit to the address word. Negative counts backward.
# also      More names from the same hit. at selects another word.
#           add is a byte offset from the address already taken.
#
# A later row with the same name fills it only when the earlier window missed.

calls:
  "13": {'0': '0x7312', '402': '0x0000', '602': '0x25D4'}
  "14": {'0': '0x73DE', '402': '0x0000', '602': '0x268C'}
  "17": {'0': '0x78B8', '402': '0x0000', '602': '0x2B24'}
