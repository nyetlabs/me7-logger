# Byte patterns that locate Bosch names, then calibration maps.
# Rows run from top to bottom. A row can splice in a name an earlier row
# already found, so add it below that name.
#
# calls
#   Bootrom call-table words. The outer key is the slot. The inner keys are
#   the tables 0, 402, and 602. Keep them quoted.
#   {slot:N} inserts the word for slot N, using the same call count as the clock.
#   N is the callsSlot argument: 13 is 0xd, 14 is 0xe, 17 is 0x17, and the
#   other keys are the hex digits of the argument.
#
# name      Bosch name to store.
# size      Width in bytes.
# from      Lowest address to search. Omitted means 0x804000.
# pattern   Bytes to find. One string, or a list tried in order.
#           X, x, and ? are nibble wildcards. {name:MID} splices a known
#           address in EXTP form: page, the name, then the word.
# open      Find this copy first. The DB00 window around it limits pattern.
#           The copy has to occur once unless first is set.
# first     With open, keep the first copy when several exist.
# in        Search the window an earlier open row saved.
# after     Start just after that row's hit and stop at the next DB00.
# absent    Skip this row when this pattern is already in the range.
# single    Keep the row only when the pattern occurs once.
# steps     Several searches in a chain. skip is bytes past the previous hit.
# at        Bytes from the hit to the address word. Negative counts backward.
# also      More names from the same hit. at selects another word.
#           add is a byte offset from the address already taken.
#
# mapsigs locate a calibration map from a byte window in flash.
# pattern   A window that occurs once. XX is the address word inside it.
#           {name:MID} and {slot:N} splice the same way as a signature.
# at        Bytes from the hit to that word. Omitted means 2.
#           Negative reads the pointer in front of the hit.
# open      Find this copy first. The DB00 window around it limits pattern.
#           The copy has to occur once unless first is set.
# first     With open, keep the first copy when several exist.
# from      Lowest address to search. An omitted open starts at 0x820000.
# single    With open, keep the row only when pattern occurs once in the window.
# frame     The pointer at `at` is the 6-byte segmented form.
# far       The pointer at `at` is the 4-byte segmented form.
# deref     Read this many further words at the decoded address.
# derefat   Bytes added before the first of those reads.
# dereffar  That read is the 4-byte segmented pointer.
# add       Bytes from the decoded pointer to the map body.
#           With anchor, bytes from a map this list already found.
# anchor    That earlier map. Its axis words are used unless this row sets its own.
# rows      Row-axis point count, when the axes sit in front of the body.
# cols      Column-axis point count. A curve sets cols and leaves rows out.
# plain     Keep that count when no axis is stored in front of the body.
# xbits     Column breakpoint width, 8 or 16. Omitted means 8 when cols is set.
# ybits     Row breakpoint width, 8 or 16. Omitted means 8 when rows is set.
# xat, yat  Bytes from the hit to the F2 that loads that axis header from RAM.
#           The count byte at the header has to match cols or rows.
# table     The hit is the count byte of a breakpoint table.
# xtable    Column table, by name. Its count has to match cols.
# ytable    Row table, by name. Its count has to match rows.
#
# A later row with the same map name fills it only when the earlier window missed.

calls:
  "13":
    "0": "0x7312"
    "402": "0x0000"
    "602": "0x25D4"
  "14":
    "0": "0x73DE"
    "402": "0x0000"
    "602": "0x268C"
  "17":
