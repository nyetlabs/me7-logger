- {name: KFZW2_1_A, open: '{zwgru:F7F8}08XX', pattern: '47FXFF003DXXC2FXXXXX5C1XD4CXXXXXE6FDXXXXF2FEXXXXF2FFXXXX{slot:17}', at: 14, deref: 1, derefat: 2}
