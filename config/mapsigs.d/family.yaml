# Cross-layout family-finder rows (was mid-40-24bcd). Loaded for every
# block except 24BCD/24bH, which still run these from 24bcd.yaml in place.
mapsigs:
# Axis-point tables shared by several curves. The hit is the count byte.
# SGA06MDUB is the gear axis of KFDMDADP and KFDMDARO. The caller reads it
# from RAM 0x8EBE. That word is stored as 0x0500, then copied from RAM 0x8AF8.
# The store of the header address itself has not turned up, so the table is
# matched by these bytes. Another binary can reuse the name once its store,
# or its own pattern, is known.
- {name: SGA06MDUB, pattern: '06010203040506', table: true}
- {name: ap_tmot, pattern: 0618405BXX90B806, table: true}
- {name: ap_nmot, pattern: 100A141E28323C46, table: true}
# 4D1907558 FWFTBRTA axis. The count sits 24 bytes in. The same bytes are on 0002.
- {name: ap_fwftbrta, pattern: 40404040404000080B25405B687583AB8B85807C7A7876710E0B182533404D5B687583909DABB871, table: true, add: 24}
- {name: NFSM, pattern: 060243F8BA1C9D05, at: 4, add: 1, cols: 6, xtable: ap_tmot}
- {name: NLLM, pattern: 060243F8C11C9D05, at: 4, add: 30, cols: 6, xtable: ap_tmot}
- {name: DWKRMSN, pattern: 0602C2F4XXXX68412D1BF2F48E9B42F4XXXX, at: 4, add: 1, cols: 16, xtable: ap_nmot}
- {name: KRFKLN, pattern: 'FD04E11A75FA[00/F9]A50D12D7400602F3F8[88/8D]1XD740', at: 16, add: 17, cols: 16, xtable: ap_nmot}
# 22N copy of RLSALULL. The tail matches the row above; these front bytes differ.
- {name: NWPMBBR, pattern: F3F87AF843F8XXXX8D0AF3FA, at: 6}
# Family-finder maps. addMap and addMapRef store this pointer.
# addMapAt is absent: its address is the body after the counts.
- {name: MLHFM, from: '0x820000', pattern: F2FXXXXX7C1X46FX00029DXXF0XX5C1XD4XXXXXX, at: 18, cols: 512, plain: true}
- {name: WFRL, pattern: E6FCXXXXF2FDXXXXE6FE1F00DAXXXXXXF05X7C14, at: 2, cols: 31, plain: true}
- {name: KFFWL_0_A, pattern: E6FCXXXXF2FDXXXXE6FE1X00DAXXXXXXXXXXXXXXXXXX, at: 20, deref: 1, dereffar: true}
- {name: KFFWL_1_A, pattern: E6FCXXXXF2FDXXXXE6FE1X00DAXXXXXXXXXXXXXXXXXX, at: 20, deref: 1, derefat: 4, dereffar: true}
- {name: KFFWLW, pattern: E6FCXXXXF2FDXXXXE6FE1X00DAXXXXXXXXXXXXXXXXXXXXXX, at: 18, frame: true}
- {name: KFFWLW, pattern: E6FCXXXXF2FDXXXXE6FE1X00DAXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX, at: 34, frame: true}
- {name: KFFWLW, pattern: E6FCXXXXE6FDF100F2FEXXXXF2FFXXXXDA005678F084E6FCXXXXE6FDF100F2FEXXXXF2FFXXXXDA005678, at: 24, xat: 36, yat: 32}
- {name: WFRL, pattern: E6FCXXXXF2FDXXXXE6FE1A00DAXXXXXX7C14F058, at: 2, cols: 26, plain: true}
- {name: WFRL, pattern: E6FCXXXXF2FDXXXXE6FE1F00DAXXXXXX7C14F058, at: 2, cols: 31, plain: true}
- {name: LDRXNZK, pattern: C2F5XXXX5C858850E6FCXXXXE6FDXXXXF2FEXXXXDA80XXXX9820, at: 10, frame: true, add: 34, cols: 16, xbits: 16}
- {name: LDRXN, pattern: C2F4XXXX5C848840E6FCXXXXE6FDXXXXF2FEXXXXDA80XXXX9820, at: 10, frame: true, add: 34, cols: 16, xbits: 16}
# scanPed split arm. The first C2F4 call in the window is the KFPEDR pair.
# The second call, marked by the F2 F4 prefix, is the KFPED pair. Each pair
# is one pointer and the next word. F2 FF is the rpm column and F2 FE is the
# pedal row. The plain names are the other arm.
- {name: KFPEDR_0_A, open: F2F40EFEF189F19A7C85F0XXC2F4XXXX5C14D4C4XXXXE6FDXXXXF2FEXXXXF2FFXXXXDA8XXXXX, pattern: C2F4XXXX5C14D4C4XXXXE6FDXXXXF2FEXXXXF2FFXXXXDA8XXXXX, at: 8, deref: 1, xat: 20, yat: 16}
