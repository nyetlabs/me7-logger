# F2 FF is the column and F2 FE is the row. FZWWLRLN's column is load and its
# row is rpm. KFMI_UM's column is rpm and its row is load.
- {name: FZWWLRLN, open: 'E6FCXXXXE6FDXXXXF2FEXXXXF2FFXXXX{slot:17}X0XX0B98', pattern: 'E6FCXXXXE6FDXXXXF2FEXXXXF2FFXXXX{slot:16}', at: 2, xat: 14, yat: 10}
