- {name: KFZW2, open: '{zwgru:F7F8}08XX', pattern: '47FXFF003DXXE6FCXXXXE6FDXXXXF2FEXXXXF2FFXXXX{slot:17}', at: 18}
- {name: KFZW2, open: '{zwgru:F7F8}98X0', pattern: '47FXFF003DXXE6FCXXXXE6FDXXXXF2FEXXXXF2FFXXXX{slot:17}', at: 18}
- {name: KFZW2, open: '{zwgru:F7F8}9AXXXXXX', pattern: '47FXFF003DXXE6FCXXXXE6FDXXXXF2FEXXXXF2FFXXXX{slot:17}', at: 18}
- {name: KFZW2, open: '{zwgru:F7F8}C2F4XXXX', pattern: '47FXFF003DXXE6FCXXXXE6FDXXXXF2FEXXXXF2FFXXXX{slot:17}', at: 18}
