# 22N fault path class table, read as [Rw + 0x073B]. 22N has one more path
# before these than 22m, so each index is one past the 22m index. The rows
# DAMOS often omits ESKONF; the checks are still in the image.
# Dual 0x55 checks; ESKONF starts 8 before the first. Keep these before the
# single-check 2804 row — that pattern is a prefix. Do not XX the dual: HF
# repeats one word twice, and add -8 would miss.
# 22N T/AA. Bytes 8 and 10 (110D/130D); before 510D — that hit is empty 0x80.
- {name: ESKONF, pattern: 8880887088602804F3F8110D47F855003D06F3F8130D47F85500, at: 10, add: -8}
- {name: ESKONF, pattern: 510DBD0C8D0CXXXX8711E310, at: 6}
