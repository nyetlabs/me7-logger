# Measurements. Selector cases locate RAM variables from the catalog.
# A row here is written when a needle of the same name is supplied, from
# config/user. That needle's label is the mem operand; generate maps it through
# the image DPP. When that address is inside a selector case, the case supplies
# the result type and the catalog is not used for that case.
# A stub is not written. There is no address in this file.
# Where a name was in both hand lists, the torque factor and comment are kept.
#
# A measurement may omit size, bitmask, unit, signed, inverse, factor, and
# offset. Omitted, those are 2, 0, "", false, false, 1, and 0. The conversions
# in config/names.yaml map a size and a unit onto omitted signed, inverse,
# factor, and offset. An omitted conversion size is 2. A field written on the
# row wins. conversion selects a named scale, which is not a size+unit
# default. torque is unit "" and 100/0x10000. twice is 200/0x10000 and keeps
# the row's unit. half is the 1/2 byte percent. retard is °KW -3/4; the °KW
# default stays signed +3/4. amp is a blank byte, 800/0x10000, not the 1/100
# timer. config/user/*.yaml can add, replace, or drop
# pairs and rows.
# A word with no unit uses 1/4. Signed speed differences set signed.
# A "%" word uses 100/0x10000, one percent of a 16-bit word. 1/0x10000 is the
# fraction of the word. A byte scale is n/256, as in 1/256 or 10/256.
# Other percent words set factor.
# A byte with no unit uses 1/100. A single-bit bitmask is a flag and
# does not take that pair.
