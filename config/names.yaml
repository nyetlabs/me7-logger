# Names and clock scales the generator reads. Edit this file.
# Nothing here is compiled into the program.
#
# map_name    File name written for the catalog.
# connect     Slow-init and fast-init needles, KWP keys, and the addresses to try.
# clock       Milliseconds per timer tick, keyed by CPU megahertz.
#             20 and 40 MHz are 1/312.5, 24 MHz is 1/375, 32 MHz is 1/250.
#             injection is the names that use the injection timer.
#             KRKTE uses that factor divided by 24.
# scale_5120  Pressure names checked against the 400–1200 mbar band.
# selector_*  Start bytes and end address of the result-type selector.
#
# Leave the top-level keys in this order. Sort injection and ambient by name,
# and the megahertz factors by frequency.

map_name: catalog.yaml

connect:
  slow_init_needle: slow_init_table
  fast_init_needle: fast_init_physical
  kwp_key1: "0xEF"
  kwp_key2: "0x8F"
  prefer_address: "0x11"
  fallback_address: "0x01"
  fast_targets: ["0x01", "0x10"]

clock:
  default_mhz: 24
  krkte: KRKTE
  injection:
    - DTEPRU
    - DTIABS
    - te2_w
    - te_w
    - TEMIN
    - TEMINVA
    - ti_avg
    - ti_b1
    - ti_b2
    - timx_w
    - timxth_w
    - TVTSPEP
    - TVUB
  factors:
    "20": 1/312.5
    "24": 1/375
    "32": 1/250
    "40": 1/312.5

scale_5120:
  units: [mbar, mBar]
  ambient: [PUE, PUMN, PUMX]
  low_mbar: 400
  high_mbar: 1200

selector_prefixes:
  - "D440120066F40F00"
  - "D440140066F40F00"
selector_end: "0x3F7"

# Shared scales. A row with no name matches a measurement or catalog value
# by size and unit, and fills signed, inverse, factor, and offset when that
# value leaves them blank. Omitted size here is 2. A catalog value whose size
# is 0 stays as written. A field set on the measurement or catalog row is kept.
# A one-bit measurement bitmask skips this list.
# A row with a name is used only when a measurement sets conversion. Its unit
# can be blank. Sort unnamed rows by size, then unit, and named rows by name.
conversions:
- size: 1
  unit: ""
  factor: 1/100
- size: 1
  unit: "%"
  factor: 3/4
- size: 1
  unit: rpm
  factor: 40
- size: 1
  unit: "°C"
  factor: 3/4
  offset: 48
- size: 1
  unit: "°KW"
  signed: true
  factor: 3/4
- unit: ""
  factor: 1/4
- unit: "%"
  factor: 100/0x10000
- unit: g/s
  factor: 1/36
- unit: mbar
  factor: 10/256
- unit: rpm
  factor: 1/4
- name: amp
  size: 1
  unit: ""
  factor: 800/0x10000
- name: half
  size: 1
  unit: "%"
  factor: 1/2
- name: retard
  size: 1
  unit: "°KW"
  factor: -3/4
- name: torque
  unit: ""
  factor: 100/0x10000
- name: twice
  factor: 200/0x10000
