# Test and build on every push and PR. The work is in the Makefile.
name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: make test
        run: make test
      - name: make parity
        run: make parity
      - uses: actions/upload-artifact@v7
        with:
          name: me7
          path: |
            build/me7info
            build/me7logger
