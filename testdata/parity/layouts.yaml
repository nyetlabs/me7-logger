# Code layout blocks. Images in one block are likely to share needle variants,
# code flow, and map locations. The key is a label from the comments in
# config/needles.yaml, or the needle that sets the block apart. The list is the
# durable id of each image: the Bosch software number (1037...), or the EPK
# string when the image carries no software number. The comment is the part
# number.
#
# The blocks come from which variant of each needle hits. A near match stays in
# the block: 8D0907551F with 8D0907551K and 8D0907551Q, 4Z7907551T (dataset
# 25B) with 4Z7907551S, 4Z7907551AA, and 4Z7907551R, 06A906032LP and
# 8N0906018CB with 06A906032HF and 06A906032HS, and 06A906032S with
# 4B0906018Q. 8D0907551A/B are X22ka (2.7T), not the S/Q 1.8T block.
# 24bH is the 24BCD code without maps its DAMOS export does not have.
# datasets.yaml is a different grouping: calibration contents, not code.
22m:
  - "1037354144" # 4B0907551S
  - "1037354145" # 8D0907551L
  - "1037354146" # 4B0907551T
  - "1037354774" # 8D0907551H
  - "1037354823" # 8D0907551N
  - "1037354837" # 8D0907551M
  - "1037360855" # 8D0907551G
