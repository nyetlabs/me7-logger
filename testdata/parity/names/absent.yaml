# Names a code layout block (layouts.yaml) does not have. A DAMOS export
# that omits the name is evidence. Without one, the comment says why the name
# is listed, and the entry stays until a DAMOS export settles it. An image in
# that block counts the name as hit for the tier grade. It still misses in the
# tuner count. A name in an any family counts as absent only for that form.
# The family is met when one form is located, or when every form is listed.
absent:
  # Not in the 8D0907551M-0002 DAMOS export, nor in G, H, or L.
  # The export has KFZW2, NFSM, and NLLM, and NLL2M_0_A and NLL2M_1_A,
  # so those families are located rather than listed here. The pair call
  # and the four-curve call are not in this block.
  # The Q1 integrator is not the KFLDRQ1 map. scanLdr stores LDRQ1DY and
  # LDRQ1ST on this arm, and both are located.
  22m:
    - KFLDRQ1
    - KFZW2_0_A
    - KFZW2_1_A
    - NLLM_0_A
    - NLLM_1_A
    - NLLM_2_A
    - NLLM_3_A
  # No DAMOS export yet. No map_interp_table8_b call with M's arguments on T,
  # and the 8D0907551H hand XDF does not have it.
  22N:
    - KFVPLGU
  # Not in the 4B0906018CM DAMOS export.
  1.8T-CM:
    - CDLSHV
    - CLAHSHE2
    - CLALSH2
    - CLRHK
    - CLRHKA
    - CLRKA
    - DLBTS
    - KFLAFWL
    - KFLAMKR
    - KFLBTS_0_A
    - KFVPLGU
    # The export has no NLLM form: no plain curve and no NLLM_N_A.
    - NLLM
    - NLLM_0_A
    - NLLM_1_A
    - NLLM_2_A
    - NLLM_3_A
    - RLSALULL
    - RLSALUN
    - SNM16OPUW
    - TABGSS2
  # Not in the 06A906032HF DAMOS export. The NLLM family is the split
  # curves NLLM_0_A through NLLM_3_A, so the plain name is not listed.
  1.8T:
    - CDLSHV
    - CLAHSHE2
    - CLALSH2
    - CLRHK
    - CLRHKA
    - CLRKA
    - DLBTS
    - FKHABMN
    # Not in the LP or NL code. Both go from the boost loads straight to
    # KFVPDKLD, where HF calls KFDLULS in between. No DAMOS export for
    # either. To do: look for it by hand in WinOLS.
    - KFDLULS
    - KFLBTS_0_A
    - KFMIZUNS
    - KFVPLGU
    - RLSALULL
    - RLSALUN
    # The HF DAMOS export lists it at 0x130A6, the count word, and the
    # finder stores 0x130A8. To do: look for it by hand in WinOLS and
    # confirm.
    - SNM16OPUW
    - TABGSS2
  # 4Z7907551R has the full DAMOS. It has KFDLBTS, ZDLBTS, TABGBTS, and
  # DTBTS, and it does not have DLBTS. The lambts window has no
  # C2FC E6FD E6FE DA8X arm. It also has no KFMIZU map. The only
  # 0D0B E6FC E6FD call is KFWEE / KFWEEK. The same export has
  # KLRLSALULL, KFTABGSS, and KFTABGSS2, and it does not have the
  # RLSALULL byte or the TABGSS scalars. ASE_rlsalun passes the curve.
  4Z7:
    - DLBTS
    - KFMIZUFIL
    - KFMIZUNS
    - KFMIZUOF
    - RLSALULL
    - TABGSS
    - TABGSS2
  # No DAMOS export yet. No image in this block has the DA 00 42 76 call,
  # so KFVPLGU and SNM16OPUW have no reader. DLBTS is only stored from the
  # scanLbts arm that starts with 42 F4 FD 02. DH misses that chain. DQ
  # takes the other arm, which does not store DLBTS. The M call
  # 42 F4 FD 07 D7 40 .. 02 F2 F4 does not occur here.
  4Z7-like:
    - DLBTS
    - KFVPLGU
    - SNM16OPUW
  # No DAMOS export. 1037371702 is the naturally aspirated V8.
  # plsol, rlmx_w, and ldtvm are not in the routine table, so scanLdr,
  # scanLdrxn, and scanLdrapp do not open. The knock window does not
  # contain KFMIZUOF, and the only 6E 27 F6 F4 frame has no axis.
  # DLBTS, KFVPLGU, and SNM16OPUW stay absent for the same reason as
  # 4Z7-like.
  4Z7-na:
    - DLBTS
    - KFFLLDE
    - KFLDHBN
    - KFLDIOPU
    - KFLDRAPP
    - KFLDRL
    - KFMIZUOF
    - KFVPLGU
    - LDPBN
    - LDRXN
    - SNM16OPUW
  # Not in the 8D0907551F DAMOS export. That export has KFDLBTS, ZDLBTS,
  # and TABGBTS, and it does not have these. It also has no FKKVS or KFTARX.
  # ESKONF is not in that export either; the 0x55 check is still in the image.
  # The export has LDRQ1DY and LDRQ1ST, and it does not list KFLDRQ1.
  # It has KIFZGHG_0_A, KIFZGHG_1_A, and KIFZGHG_2_A, and it
  # does not list KIFZGHG.
  23g:
    - DLBTS
    - FKKVS
    - KFLBTS_0_A
    - KFLDRQ1
    - KFTARX
    - KFVPLGU
    - KIFZGHG
  # No DAMOS export. Neither image has the DA 00 42 76 call, so KFVPLGU
  # and SNM16OPUW have no reader. The lambts window has DA 83 94 48
  # 06 F0 0C 00, so scanLbts takes the KFDLBTS arm and does not store DLBTS.
  25C:
    - DLBTS
    - KFVPLGU
    - SNM16OPUW
