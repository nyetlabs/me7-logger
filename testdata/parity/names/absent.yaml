# Names a code layout block (layouts.yaml) does not have. A DAMOS export
# that omits the name is evidence. Without one, the comment says why the name
# is listed, and the entry stays until a DAMOS export settles it. An image in
# that block counts the name as hit for the tier grade. It still misses in the
# tuner count. A name in an any family counts as absent only for that form.
# The family is met when one form is located, or when every form is listed.
absent:
  # Not in the 8D0907551M-0002 DAMOS export, nor in G, H, or L.
  # The export has KFZW2, NFSM, and NLLM, and NLL2M_0_A and NLL2M_1_A,
  # so those families are located rather than listed here. The pair call
  # and the four-curve call are not in this block.
  # The Q1 integrator is not the KFLDRQ1 map. scanLdr stores LDRQ1DY and
  # LDRQ1ST on this arm, and both are located.
  22m:
    - KFLDRQ1
    - KFZW2_0_A
    - KFZW2_1_A
    - NLLM_0_A
    - NLLM_1_A
    - NLLM_2_A
    - NLLM_3_A
  # No DAMOS export yet. No map_interp_table8_b call with M's arguments on T,
  # and the 8D0907551H manual XDF does not have it.
  # Same KFLDRQ1 arm as 22m: LDRQ1DY and LDRQ1ST are located; the Q1
  # integrator is not the map.
  22N:
    - KFLDRQ1
    - KFVPLGU
  # Not in the 4B0906018CM DAMOS export. 4B0907551 S/T and 8D N are in 22m.
  24bH:
    - CDLSHV
    - CLAHSHE2
    - CLALSH2
    - CLRHK
    - CLRHKA
    - CLRKA
    - DLBTS
    - KFLAFWL
    - KFLAMKR
    - KFLBTS_0_A
    - KFVPLGU
    # The export has no NLLM form: no plain curve and no NLLM_N_A.
    - NLLM
    - NLLM_0_A
    - NLLM_1_A
    - NLLM_2_A
    - NLLM_3_A
    - RLSALULL
    - RLSALUN
    - SNM16OPUW
    - TABGSS2
  # Not in the 06A906032HF DAMOS export. The NLLM family is the split
  # curves NLLM_0_A through NLLM_3_A, so the plain name is not listed.
  24BCD:
    - CDLSHV
    # Not in the LQ, NL, BB, or CJ DTC index. The slot after CLAATS is
    # 1479, not 1457. Images that have 1457 locate the class byte.
    - CLAATS2
    - CLAHSHE2
    - CLALSH2
    - CLRHK
    - CLRHKA
    - CLRKA
    - DLBTS
    - FKHABMN
    # KFDLULS: not block-absent. HF/HS/HN have it; LP/NL use KFVPDKLD/KLDLUL.
    # SNM16OPUW: not absent. HS/HJ/HN/AL DAMOS use 0x130A8 (708C); BB uses
    # 9E8C. HF's export lists 0x130CA on the same bytes (CE8C) — leave as a miss.
    - KFLBTS_0_A
    - KFMIZUNS
    - KFVPLGU
    # HF/HS DAMOS has LDRQ0S and LDRQ1ST beside KFLDRQ2, and no LDRQ0DY or
    # LDRQ1DY. The ldrq window stores those two curves only.
    - LDRQ0DY
    - LDRQ1DY
    - RLSALULL
    - RLSALUN
    - TABGSS2
  # 4Z7907551R has the full DAMOS. It has KFDLBTS, ZDLBTS, TABGBTS, and
  # DTBTS, and it does not have DLBTS. The lambts window has no
  # C2FC E6FD E6FE DA8X arm. It also has no KFMIZU map. The only
  # 0D0B E6FC E6FD call is KFWEE / KFWEEK. The same export has
  # KLRLSALULL, KFTABGSS, and KFTABGSS2, and it does not have the
  # RLSALULL byte or the TABGSS scalars. ASE_rlsalun passes the curve.
  25A:
    - DLBTS
    - KFMIZUFIL
    - KFMIZUNS
    - KFMIZUOF
    - RLSALULL
    - TABGSS
    - TABGSS2
    # VMAXNB: not absent. R/AA DAMOS have VMAXNB_0_A/_1_A (sets.yaml any).
  # DLBTS: lambts takes the non-store arm here. KFVPLGU: no DA 00 42 76.
  # CLRH*: no 67 F8 11 00 reader. RLSALU*: no 74 F4 BC 8C / ASE path.
  # NMAXF: DH/DQ/AK/AS A2L omit it (NMAX stays). DC DAMOS has it and still
  # locates. SNM16OPUW: omitted on DC/DQ/AK/AS; DH still locates.
  # Not absent (DH A2L / sibling DAMOS have them; a generate miss is a miss):
  # FKKVS, KFTARX, KFNLLNST, NFS2M/NFSM family, CATR, CLAHSH2,
  # and the CLAATR/CLAATS/CLALSH DTC class bytes (present on some parts).
  24EGKS:
    - DLBTS
    - KFVPLGU
    - CLRHK
    - CLRHKA
    - CLRKA
    - NMAXF
    - RLSALULL
    - RLSALUN
    - SNM16OPUW
  # No DAMOS export. 1037371702 is the naturally aspirated V8.
  # plsol, rlmx_w, and ldtvm are not in the routine table, so scanLdr,
  # scanLdrxn, and scanLdrapp do not open. The knock window does not
  # contain KFMIZUOF, and the only 6E 27 F6 F4 frame has no axis.
  # DLBTS and KFVPLGU stay absent for the same reason as 24EGKS.
  # Def lists NMAXF only (no NMAX, no VMAXNB forms).
  05A:
    - DLBTS
    - KFFLLDE
    - KFLDHBN
    - KFLDIOPU
    - KFLDRAPP
    - KFLDRL
    - KFMIZUOF
    - KFVPLGU
    - LDPBN
    - LDRXN
    - NMAX
    - SNM16OPUW
    - VMAXNB
    - VMAXNB_0_A
    - VMAXNB_1_A
  # Not in the 8D0907551F DAMOS export. That export has KFDLBTS, ZDLBTS,
  # and TABGBTS. ESKONF is not in that export either; the 0x55 check is
  # still in the image. The export has LDRQ1DY and LDRQ1ST, and it does
  # not list KFLDRQ1. It has KIFZGHG_0_A..2_A, and it does not list KIFZGHG.
  # FKKVS: K/Q DAMOS have it and generate locates it on F/K/Q — not absent.
  # KFTARX: omitted from F/K/Q DAMOS.
  23g:
    - DLBTS
    - KFLBTS_0_A
    - KFLDRQ1
    - KFTARX
    - KFVPLGU
    - KIFZGHG
  # Same KFLDRQ1 arm as 22m/RS4 (G/M DAMOS): LDRQ1DY and LDRQ1ST are
  # located; the Q1 integrator is not the map. Other C/B names the RS4
  # DAMOS has are not absent here.
  X22ka:
    - KFLDRQ1
  # No DAMOS export. Neither image has the DA 00 42 76 call, so KFVPLGU
  # and SNM16OPUW have no reader. The lambts window has DA 83 94 48
  # 06 F0 0C 00, so scanLbts takes the KFDLBTS arm and does not store DLBTS.
  # 4D1/Spyker defs list NMAXF only (no NMAX, no VMAXNB forms).
  25C:
    - DLBTS
    - KFVPLGU
    - NMAX
    - SNM16OPUW
    - VMAXNB
    - VMAXNB_0_A
    - VMAXNB_1_A
