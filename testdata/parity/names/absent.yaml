# Names a code layout block (layouts.yaml) does not have. A DAMOS export
# that omits the name is evidence. Without one, the comment says why the name
# is listed, and the entry stays until a DAMOS export settles it. An image in
# that block counts the name as hit for the tier grade. It still misses in the
# tuner count. A name in an any family counts as absent only for that form.
# The family is met when one form is located, or when every form is listed.
#
# Every entry needs a same-line rationale: located equivalent (_0_A / sibling
# name) or why the map is missing (NA, no reader, not in that DAMOS). Do not
# absent a name a sibling DAMOS in this block still lists.
absent:
  # Not in the 8D0907551M-0002 DAMOS export, nor in G, H, or L.
  22m:
    - KFLDRQ1 # LDRQ1DY + LDRQ1ST located; Q1 integrator is not the map
    - KFZW2_0_A # KFZW2 located
    - KFZW2_1_A # KFZW2 located
    - NLLM_0_A # NLLM located
    - NLLM_1_A # NLLM located
    - NLLM_2_A # NLLM located
    - NLLM_3_A # NLLM located
  # No DAMOS export yet. No map_interp_table8_b call with M's arguments on T,
  # and the 8D0907551H manual XDF does not have it.
  22N:
    - KFLDRQ1 # LDRQ1DY + LDRQ1ST located; Q1 integrator is not the map
    - KFVPLGU # no DA 00 42 76 reader
  # Not in the 4B0906018CM DAMOS export. 4B0907551 S/T and 8D N are in 22m.
  # CDLSHV / NLLM*: not absent — generate hits them on CM; CM DAMOS omits the
  # plain NLLM names but lists no excuse to paper the generate hits.
  # SNM16OPUW: not absent. CM DAMOS lists it; a generate miss is a miss.
  # 512K APU. No CM/CH DAMOS for these stems; readers/cal blobs below are absent.
