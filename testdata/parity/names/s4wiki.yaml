# Bosch names from https://s4wiki.com/wiki/Tuning, scored on every image.
# Each tier maps an axis count to names: 0 scalar (the address alone counts),
# 1 curve, 2 map. Tiers are finder priority by tuning stage, highest first.
# Opinion, not measurement:
#   D  stage 1: boost, timing, torque monitoring, knock, BTS and open loop fueling
#   C  stage 2: injector and FPR changes, exhaust DTCs
#   B  stage 3-: bigger turbos: base boost, wastegate spring, LDR PID scheduling, MAP sensor limit
#   A  stage 3: MAF and intake, ARMD
#   S  niceties and everything else
tiers:
  S:
    0: [AIMVM, CDLDP, CDTES, CWDNMAX, CWMSRCAN, DNMAXH, ITNMXH, KISRM, KUMSRL,
        NMAX, NMAXF, NMAXOG, NWPMBBR, TMOTNMX, TNMXH, VMAXNB, VNMX, VWPMBBR]
    1: [KLDMASRL, NASNOTKL]
    2: [KFTSRL]
  A:
    0: [KIFZGHG, MLHFM, MLMAX, MLOFS]
    2: [KFDMDADP, KFDMDARO, KFKHFM, KFMLDMX, KFNW, KFNWWL, KFPBRK, KFPBRKNW,
        KFPRG, KFURL]
  B:
    0: [DSLOFS, LDEIAP, LDRQ0S, UMDYLDR]
    1: [LDRQ0DY, LDRQ1DY, LDRQ1ST, TLDIAPN, WDKUGDN]
    2: [KFLDRQ2, KFMSNWDK, KFVPDKSD, KFVPDKSE, KFWDKMSN]
  C:
    0: [CATR, CDATR, CDATS, CDHSH, CDHSHE, CDKAT, CDLASH, CDLATV, CDLSH,
        CDLSHV, CDSLS, CLAATR, CLAATR2, CLAATS, CLAATS2, CLAHSH, CLAHSH2,
        CLAHSHE, CLAHSHE2, CLALSH, CLALSH2, CLRHK, CLRHKA, CLRKA, CWDLSAHK,
        CWKONABG, CWKONLS, ESKONF, FHOKH, FKHABMN, FKVA, KRKTE, KVB, RLSALULL,
        TABGSS, TABGSS2, TEMIN, TEMINVA]
    1: [NFSM, NLLM, RLSALUN, TVUB]
    2: [FKKVS, KFFWL_0_A, KFFWL_1_A, KFLF, KFMRES, KFMRESK, KFNLLNST]
  D:
    0: [CWLAMFAW, CWMDAPP, DLAMFAW, DPUPS, EDLDRP, KRALH, KRANH, KRDWA, LDHIA,
        MDIMX, NLDIAPU, SDLDRL, SNM16OPUW, TABGBTS, TDLDRA, TDLDRA2, TMNSMN,
        TULV1, ZKWLAFWL]
    1: [DLAMTANS, DLBTS, DWKRMSN, FBSTABGM, FWFTBRTA, KRFKLN, LDIATA, LDORXN,
        LDPBN, NDLDRAPU]
    2: [KFDLULS, KFFLLDE, KFFWTBR, KFLAFWL, KFLAMKR, KFLAMKRL, KFLBTS_0_A,
        KFLDHBN, KFLDIMX, KFLDIOPU, KFLDRAPP, KFLDRL, KFLDRXO, KFMDZOF_UM,
        KFMIOP, KFMIRL, KFMIZUFIL, KFMIZUNS, KFMIZUOF, KFMPED_UM, KFTARX,
        KFTARXZK, KFVPDKLD, KFVPLGU, KFWPLGTA, KFZW, KFZW2, KFZWOP, KFZWOP2,
        KFZWWLNM, LAMFA]
