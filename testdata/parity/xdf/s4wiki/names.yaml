# Bosch names from https://s4wiki.com/wiki/Tuning, scored on every image.
# The number is how many axes the table has, taken from the M-box shapes:
#   0  scalar, so the address alone counts and the axis score ignores it
#   1  curve (the column). A one-row table counts as 1
#   2  map (column and row)
# When the image XDF contains the name, the body address has to match one of its rows.
# The axis score counts maps that have their axis. Confidence counts names that hit.
